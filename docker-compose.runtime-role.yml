# Opt-in override only. Invoke with:
# docker compose -f docker-compose.yml -f docker-compose.runtime-role.yml --env-file <operator-vars> up ...
#
# RUNTIME_ENV_FILE is root-owned curated runtime-only environment. It contains
# runtime application/Redis values and the non-owner DATABASE_URL. It must not
# contain MIGRATION_DATABASE_URL, PostgreSQL owner/bootstrap credentials, or
# deployment-only owner secrets. Migration is an external one-shot command.
# This Compose v5 override uses !override so inherited .env is not loaded.

x-runtime-env: &runtime-env
  env_file: !override
    - path: ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE required for limited role mode}
      required: true
  environment: !override
    DATABASE_RUNTIME_ROLE_ENABLED: "true"
    MIGRATION_DATABASE_URL: ""

services:
  api:
    <<: *runtime-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker-poller:
    <<: *runtime-env
  worker-webhook:
    <<: *runtime-env
  worker-sweeper:
    <<: *runtime-env
  worker-expirer:
    <<: *runtime-env
