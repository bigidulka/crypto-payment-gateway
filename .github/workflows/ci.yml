name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_arbitron_payment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NON_EVM_ENABLED: "true"
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: Y2ktZW5jcnlwdGlvbi1rZXktMDEyMzQ1Njc4OWFiY2Q=
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_arbitron_payment
      TEST_EXPECTED_DATABASE: test_arbitron_payment
      TEST_ALLOW_DESTRUCTIVE_RESET: ALLOW_ISOLATED_TEST_DATABASE_RESET
      ISOLATED_POSTGRES_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_rails
      LEDGER_OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_ledger_owner
      LEDGER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_ledger_runtime
      LEDGER_SERVICE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_ledger_service
      LEDGER_API_COMPAT_REDIS_URL: redis://127.0.0.1:6379/0
      LEDGER_API_COMPAT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_ledger_api_compat
      PROVIDER_INGESTION_OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_provider_ingestion
      PROVIDER_INGESTION_RUNTIME_DATABASE_URL: postgresql+asyncpg://provider_ingestion_runtime:ci-runtime-password@127.0.0.1:5432/test_provider_ingestion
      GATEWAY_TEST_OWNER_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_gateway_ci
      GATEWAY_TEST_RUNTIME_DATABASE_URL: postgresql+asyncpg://gateway_ci_runtime:ci-gateway-password@127.0.0.1:5432/test_gateway_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,non-evm]"
          pip install -e sdk/python
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ton_runtime/package-lock.json
      - name: Install the isolated TON execution harness
        run: npm ci --prefix tests/ton_runtime
      - name: Cache the local EVM execution image
        run: docker pull ghcr.io/foundry-rs/foundry:latest
      - name: Create the disposable test databases
        run: |
          for db in test_rails test_ledger_owner test_ledger_runtime test_ledger_service test_ledger_api_compat test_provider_ingestion test_gateway_ci; do
            psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -c "CREATE DATABASE $db;"
          done
        env:
          PGPASSWORD: postgres
      - name: Apply migrations to every disposable database
        run: |
          for db in test_arbitron_payment test_rails test_ledger_owner test_ledger_runtime test_ledger_service test_gateway_ci; do
            DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/$db" alembic upgrade head
          done
          # The API-compatibility rehearsal pins the additive 0010 schema on purpose.
          DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_ledger_api_compat" alembic upgrade 0010_ledger_foundation
          DATABASE_URL="postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_provider_ingestion" alembic upgrade 0011_provider_payment_ingestion
      - name: Provision the reviewed runtime roles on the disposable databases
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/test_provider_ingestion" <<'SQL'
          CREATE ROLE provider_ingestion_runtime LOGIN PASSWORD 'ci-runtime-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO provider_ingestion_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO provider_ingestion_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO provider_ingestion_runtime;
          ALTER ROLE provider_ingestion_runtime SET search_path=public,pg_catalog;
          SQL
          psql "postgresql://postgres:postgres@127.0.0.1:5432/test_gateway_ci" <<'SQL'
          CREATE ROLE gateway_ci_runtime LOGIN PASSWORD 'ci-gateway-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO gateway_ci_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gateway_ci_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gateway_ci_runtime;
          ALTER ROLE gateway_ci_runtime SET search_path=public,pg_catalog;
          SQL
        env:
          PGPASSWORD: postgres
      - name: Run the guarded test suite
        run: |
          # The two ignored files rehearse an operator rollout that needs a
          # reachable psql container via `docker exec`; GitHub service
          # containers are not addressable that way. They are documented in
          # README alongside the local provisioning commands.
          pytest -q tests sdk/python/tests \
            --ignore=tests/test_application_runtime_role_template.py \
            --ignore=tests/test_prepare_runtime_schema_role.py
